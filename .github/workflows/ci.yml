name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: pip install ".[test]"
      - name: Test suite (pytest runs every smoke script against the installed package)
        run: python -m pytest -q tests
      - name: Governed Entry Point rules over the framework and reference code (smoke tests poke internals on purpose)
        shell: bash
        run: python -m e2a.conformance --strict --quiet reference/e2a $(ls reference/*.py | grep -v "smoke_test\|e2a_base.py")
      - name: Run the smoke tests against the INSTALLED package
        # python -I ignores the checkout folder, so these imports can only
        # succeed if the package was built and installed correctly.
        shell: bash
        working-directory: reference
        run: |
          for t in smoke_test_llm_service smoke_test_concurrency smoke_test_cqrs_concurrency smoke_test_simulated_llm smoke_test_propagation smoke_test_v112; do
            echo "== $t"
            python -I "$t.py" | tail -1
          done
  adapters:
    # e2a-adapters (design note D-02): every adapter passes the port contract kit, on moto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the core, then the adapters with every backend and the test extras
        run: pip install . && pip install "./adapters[aws,gcp,azure,test]"
      - name: Start the emulators (DynamoDB Local, Firestore, Cosmos DB)
        # The contract kit's concurrent races need atomic backends: moto's in-process DynamoDB is not one
        run: |
          docker run -d --name ddb -p 8000:8000 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -inMemory -port 8000
          docker run -d --name firestore -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
          docker run -d --name cosmos -p 8081:8081 mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
          for port in 8000 8085 8081; do
            for _ in $(seq 90); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 2; done
          done
          for _ in $(seq 60); do docker logs cosmos 2>&1 | grep -q "Gateway=OK" && break; sleep 2; done
      - name: Adapter tests (the port contract kit on every backend)
        env:
          DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:8000
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          COSMOS_EMULATOR_ENDPOINT: http://127.0.0.1:8081
        # -rs lists skips: none is expected here, every emulator is running
        run: python -m pytest -q -rs adapters/tests
      - name: Governed Entry Point rules over the adapters
        run: python -m e2a.conformance --quiet adapters/e2a_adapters
  java:
    # e2a-java (design note D-01): the Java runtime, built and tested with E2A's tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test e2a-core, e2a-cqrs, e2a-spring-jpa, e2a-test
        run: mvn -B -f java/pom.xml verify
