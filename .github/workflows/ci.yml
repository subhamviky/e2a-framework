name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: pip install .
      - name: Run the smoke tests against the INSTALLED package
        # python -I ignores the checkout folder, so these imports can only
        # succeed if the package was built and installed correctly.
        shell: bash
        working-directory: reference
        run: |
          for t in smoke_test_llm_service smoke_test_concurrency smoke_test_cqrs_concurrency smoke_test_simulated_llm smoke_test_propagation; do
            echo "== $t"
            python -I "$t.py" | tail -1
          done